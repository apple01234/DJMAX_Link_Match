# 운영 배포: 서버 한 대에서 `docker compose up -d --build`
# 같은 폴더의 .env 에 DOMAIN 과 ADMIN_TOKEN 을 넣는다 (.env.example 참고).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 앞단 Caddy가 접속 IP 헤더를 덮어쓰므로 IP별로 대입 제한을 건다
      TRUST_PROXY: "1"
    volumes:
      - data:/data
      - backups:/backups

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?.env에 DOMAIN을 설정하세요}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  data:
  backups:
  caddy-data:
  caddy-config:
