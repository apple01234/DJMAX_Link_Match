# 로컬 개발용 Postgres. `docker compose up -d` 후 .env.local 에
#   DATABASE_URL=postgres://postgres:dev@localhost:5432/linkmatch
# 운영은 Vercel + Neon 을 쓴다 (README "배포").
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: linkmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
